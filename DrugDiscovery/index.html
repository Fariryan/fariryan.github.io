<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drug Discovery — Disease · Drug · Molecule · Mechanism</title>
  <meta name="description" content="Interconnected scientific atlas of neurological diseases, therapeutics, molecular targets, chemical structures, pathways, and clinical evidence." />
  <!-- The optical material first, the application's use of it second. -->
  <link rel="stylesheet" href="css/glass.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />

  <!-- No build step. Libraries are vendored locally so the app runs offline.
       Modules import by explicit path rather than through an import map: an
       import map is an inline script, which the Content-Security-Policy
       blocks, and loosening the policy with 'unsafe-inline' is not worth the
       convenience. The vendored OrbitControls is patched to match. -->
  <script src="vendor/3dmol.min.js"></script>
  <script src="vendor/cytoscape.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- The shell is three floating planes over one environment: the
         navigation rail, the command bar, and the workspace. The `lg-`
         classes name each one for the design system, which uses them to
         decide where the expensive optics are spent. -->
    <aside class="sidebar lg-rail">
      <div class="brand">
        <h1><span class="mark">D</span> Drug Discovery</h1>
        <p>Disease · Drug · Molecule · Mechanism</p>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <button id="theme-toggle" class="sm">Switch theme</button>
        <div>
          Research &amp; education only.<br />Not medical advice.<br />
          <a href="#/terms">Terms &amp; disclaimer</a><br />
          <span class="copyright">&copy; 2026 RONEU</span>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar lg-commandbar">
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input
            id="search"
            class="search-input"
            type="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search diseases, drugs, genes, targets, pathways, trials…"
            aria-label="Universal search"
          />
          <span class="search-kbd">⌘K</span>
          <div class="suggestions" id="suggestions"></div>
        </div>
        <div class="spacer"></div>
        <button id="compare-btn" class="sm" title="Open the comparison tray">
          Compare <span id="compare-count" class="dim">(0)</span>
        </button>
      </header>

      <main class="content" id="view">
        <div class="loading"><span class="spinner"></span> Loading…</div>
      </main>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
